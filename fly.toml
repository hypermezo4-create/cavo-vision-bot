app = "cavo-vision-bot"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  SHEET_NAME = "الورقة1"
  SHEET_REFRESH_SECONDS = "20"
  CATALOG_DIR = "/data/catalog"
  INDEX_PATH = "/data/catalog-index.npz"
  LEARNING_DIR = "/data/confirmed"
  MIN_MATCH_SCORE = "0.76"
  MIN_MATCH_MARGIN = "0.05"
  TOP_K = "3"
  PENDING_TTL_SECONDS = "600"

[processes]
  app = "cavo-bot"

[[mounts]]
  source = "cavo_data"
  destination = "/data"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
