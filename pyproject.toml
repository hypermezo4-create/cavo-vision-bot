[build-system]
requires = ["setuptools>=75,<81", "wheel>=0.44,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "cavo-vision-bot"
version = "3.0.0"
description = "Safe Telegram product recognition and live CAVO inventory lookup"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "google-genai>=1.0,<2",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "Pillow>=10,<13",
  "python-telegram-bot>=22,<23",
  "torch>=2.4,<3",
  "torchvision>=0.19,<1",
]

[project.optional-dependencies]
dev = [
  "coverage>=7.6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
cavo-bot = "cavo_bot.bot:main"
cavo-extract-xlsx = "cavo_bot.extract_xlsx:main"
cavo-build-index = "cavo_bot.recognizer:main"
cavo-recover-xlsx = "cavo_bot.recover_xlsx:main"
cavo-validate-deployment = "cavo_bot.validate_deployment:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
